<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>新闻情绪时间机器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh;padding:32px 24px}
h1{font-size:24px;font-weight:600;margin-bottom:4px;color:#fff}
.subtitle{font-size:13px;color:#666;margin-bottom:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;max-width:480px}
.stat{background:#1a1d27;border-radius:10px;padding:14px 16px}
.stat-label{font-size:11px;color:#555;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600}
.pos{color:#22c55e}.neg{color:#ef4444}.neu{color:#94a3b8}
.chart-box{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:20px}
.chart-box h2{font-size:14px;color:#888;margin-bottom:16px;font-weight:400}
.panel{background:#1a1d27;border-radius:12px;padding:20px}
.panel h2{font-size:14px;color:#888;font-weight:400;margin-bottom:14px}
.headline{padding:10px 0;border-bottom:1px solid #23263a;display:flex;align-items:flex-start;gap:10px}
.headline:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.headline-text{font-size:13px;color:#ccc;line-height:1.5;flex:1}
.headline-text a{color:inherit;text-decoration:none}
.score{font-size:12px;margin-top:2px}
#date-label{font-size:13px;color:#666;margin-bottom:10px}
.empty{color:#444;font-size:13px;padding:20px 0}
</style>
</head>
<body>
<h1>新闻情绪时间机器</h1>
<p class="subtitle">财经新闻情绪分析 · 点击图表查看当天标题</p>
<div class="stats">
<div class="stat"><div class="stat-label">正面天数</div><div class="stat-val pos" id="s-pos">—</div></div>
<div class="stat"><div class="stat-label">负面天数</div><div class="stat-val neg" id="s-neg">—</div></div>
<div class="stat"><div class="stat-label">中性天数</div><div class="stat-val neu" id="s-neu">—</div></div>
</div>
<div class="chart-box">
<h2>情绪曲线 — 过去30天（红色=恐慌 绿色=乐观）</h2>
<canvas id="chart" height="90"></canvas>
</div>
<div class="panel">
<h2>当天新闻标题</h2>
<div id="date-label">点击图表上任意日期查看</div>
<div id="headlines"><p class="empty">点击上方图表中的任意数据点</p></div>
</div>
<script>
let allData=[];
async function loadChart(){
  const res=await fetch("/api/data");
  allData=await res.json();
  const labels=allData.map(d=>d.date);
  const scores=allData.map(d=>+parseFloat(d.avg_score).toFixed(3));
  const colors=scores.map(s=>s>0.05?"rgba(34,197,94,0.85)":s<-0.05?"rgba(239,68,68,0.85)":"rgba(148,163,184,0.7)");
  let pos=0,neg=0,neu=0;
  scores.forEach(s=>{if(s>0.05)pos++;else if(s<-0.05)neg++;else neu++;});
  document.getElementById("s-pos").textContent=pos;
  document.getElementById("s-neg").textContent=neg;
  document.getElementById("s-neu").textContent=neu;
  const ctx=document.getElementById("chart").getContext("2d");
  new Chart(ctx,{
    type:"bar",
    data:{labels,datasets:[{data:scores,backgroundColor:colors,borderRadius:4,borderSkipped:false}]},
    options:{
      responsive:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>"情绪分："+c.parsed.y.toFixed(3)}}},
      scales:{
        x:{ticks:{color:"#555",font:{size:11}},grid:{color:"#23263a"}},
        y:{ticks:{color:"#555"},grid:{color:"#23263a"},suggestedMin:-0.6,suggestedMax:0.6}
      },
      onClick:(e,els)=>{if(els.length>0)loadHeadlines(allData[els[0].index].date);}
    }
  });
}
async function loadHeadlines(date){
  document.getElementById("date-label").textContent=date+" 的新闻";
  const res=await fetch("/api/headlines?date="+date);
  const items=await res.json();
  const el=document.getElementById("headlines");
  if(!items.length){el.innerHTML='<p class="empty">当天无数据</p>';return;}
  el.innerHTML=items.map(item=>{
    const s=+item.sentiment_score;
    const color=s>0.1?"#22c55e":s<-0.1?"#ef4444":"#94a3b8";
    const label=s>0.1?"正面":s<-0.1?"负面":"中性";
    return '<div class="headline"><div class="dot" style="background:'+color+'"></div><div><div class="headline-text"><a href="'+item.url+'" target="_blank">'+item.title+'</a></div><div class="score" style="color:'+color+'">'+label+' '+s.toFixed(3)+'</div></div></div>';
  }).join("");
}
loadChart();
</script>
</body>
</html>
